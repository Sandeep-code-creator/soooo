<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soni, My Valentine?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');

        :root {
            --primary-color: #ff69b4; /* Hot Pink */
            --secondary-color: #ffc0cb; /* Light Pink */
            --text-color: #333;
            --heart-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f7dadc 0%, #ffc0cb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 30px 20px;
            margin: 20px 0;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid var(--secondary-color);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-color);
            font-size: 2.8em;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .heart-icon {
            color: var(--heart-red);
            font-size: 3em;
            animation: pulse 1.5s infinite;
            display: block;
            margin: 10px auto 30px auto;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            min-height: 60px; /* Ensure space for buttons */
            position: relative;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: absolute; /* For 'No' button sliding */
        }

        #yes-btn {
            background-color: var(--primary-color);
            color: white;
            left: 50%;
            transform: translateX(-100px); /* Adjust based on button width */
        }

        #yes-btn:hover {
            transform: translateX(-100px) scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.4);
        }

        #no-btn {
            background-color: #f0f0f0;
            color: var(--text-color);
            left: 50%;
            transform: translateX(20px); /* Adjust based on button width */
        }
        
        #no-btn:hover {
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        /* After 'Yes' is clicked */
        #after-yes-message {
            display: none;
            margin-top: 30px;
            font-size: 1.3em;
            color: var(--primary-color);
            font-weight: 600;
            animation: fadeIn 1s forwards;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Photo Gallery Section */
        #photo-gallery {
            display: none;
            margin-top: 40px;
            width: 100%;
            max-width: 800px; /* Wider for gallery */
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--secondary-color);
            text-align: center;
            box-sizing: border-box;
            animation: fadeIn 1.5s forwards;
        }

        #photo-gallery h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 25px;
            position: relative;
        }

        #photo-gallery h2::after {
            content: '💖';
            position: absolute;
            right: 0;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }


        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* Responsive grid */
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            border: 1px solid var(--secondary-color);
        }

        .gallery-item:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 120px; /* Fixed height for consistent grid */
            object-fit: cover;
            display: block;
        }

        /* Background hearts */
        .falling-heart {
            position: absolute;
            color: var(--heart-red);
            font-size: 1.5em;
            opacity: 0.7;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(100vh) translateX(var(--translateX-end, 0)); opacity: 0; }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2em;
            }
            .heart-icon {
                font-size: 2.5em;
            }
            .btn {
                font-size: 1em;
                padding: 10px 20px;
            }
            #yes-btn { transform: translateX(-80px); }
            #no-btn { transform: translateX(10px); }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 10px;
            }
            .gallery-item img {
                height: 100px;
            }
            #photo-gallery h2 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="heart-icon">💖</span>
        <h1>Soni, will you be my Valentine?</h1>
        
        <div class="buttons-container">
            <button id="yes-btn" class="btn" onclick="handleYes()">Yes</button>
            <button id="no-btn" class="btn" onmouseover="handleNoHover()">No</button>
        </div>

        <p id="after-yes-message">Mujhe malum tha u want to be my Valentine! my Pakori❄️❤️</p>
    </div>

    <div id="photo-gallery">
        <h2>Our Beautiful Memories</h2>
        <p>I cherish every moment with you, Soni!</p>
        <div class="gallery-grid" id="image-grid">
            </div>
    </div>

    <script>
        // Array of your image URLs
        const imageUrls = [
            'soni1.jpg', // Replace with your actual image paths
            'soni4.jpg',
            'soni2.jpg',
            'soni3.jpg',
            'soni8.jpg',
            'soni5.jpg',
            'soni7.jpg',
            'soni9.jpg',
            'soni6.jpg',
            // Add more image URLs here
        ];

        document.addEventListener('DOMContentLoaded', () => {
            preloadImages();
            createFallingHearts();
        });

        function preloadImages() {
            const imageGrid = document.getElementById('image-grid');
            imageUrls.forEach(url => {
                const galleryItem = document.createElement('div');
                galleryItem.classList.add('gallery-item');
                const img = document.createElement('img');
                img.src = url;
                img.alt = "Soni's Photo"; // Good for accessibility
                galleryItem.appendChild(img);
                imageGrid.appendChild(galleryItem);
            });
        }

        function handleNoHover() {
            const noBtn = document.getElementById('no-btn');
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate new random position within the container bounds
            const maxX = containerRect.width - btnRect.width - 40; // 40 for padding
            const maxY = containerRect.height - btnRect.height - 40;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Set position relative to the container for simple translation
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.transition = 'none'; // Disable transition for instant jump
            
            // Re-enable transition briefly after a tiny delay for smooth animation *if* it were to move again
            setTimeout(() => {
                noBtn.style.transition = 'all 0.3s ease';
            }, 50);
        }

        function handleYes() {
            document.getElementById('yes-btn').style.display = 'none';
            document.getElementById('no-btn').style.display = 'none';
            document.getElementById('after-yes-message').style.display = 'block';
            document.querySelector('h1').innerHTML = "Yay! ❤️"; // Change the main message
            document.querySelector('.heart-icon').style.display = 'none'; // Hide initial heart
            
            // Show the photo gallery after a delay
            setTimeout(() => {
                document.getElementById('photo-gallery').style.display = 'block';
            }, 1500); // 1.5 seconds delay

            // Trigger a burst of hearts
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeartBurst, i * 100);
            }
        }

        function createHeartBurst() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 2 + 1 + 'em'; // 1em to 3em
            heart.style.animationDuration = Math.random() * 2 + 3 + 's'; // 3s to 5s
            heart.style.animationDelay = Math.random() * 0.5 + 's';
            heart.style.setProperty('--translateX-end', `${(Math.random() - 0.5) * 100}px`); // Random horizontal drift

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        function createFallingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('falling-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 1.5 + 0.8 + 'em'; // 0.8em to 2.3em
                heart.style.opacity = Math.random() * 0.5 + 0.3; // 0.3 to 0.8
                heart.style.animationDuration = Math.random() * 5 + 5 + 's'; // 5s to 10s
                heart.style.animationDelay = Math.random() * -5 + 's'; // Start some off-screen
                heart.style.setProperty('--translateX-end', `${(Math.random() - 0.5) * 50}px`); // Slight horizontal drift

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 10000); // Remove after animation finishes
            }, 300); // Create a new heart every 300ms
        }
    </script>
</body>
</html>
